services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vproject
      POSTGRES_PASSWORD: vproject
      POSTGRES_DB: vproject
    ports:
      - "5432:5432"
    volumes:
      - vproject_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  vproject_pg:
